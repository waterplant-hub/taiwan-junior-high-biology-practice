const $=id=>document.getElementById(id);
for(const c of data.chapters)$("chapter").add(new Option(String(c.order).padStart(2,"0")+" "+c.name,c.id));
for(const y of [...new Set(data.images.flatMap(i=>i.uses.map(u=>u.year)))].sort((a,b)=>a-b))$("year").add(new Option(y+" 年",y));
function add(parent,tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;parent.append(e);return e}
function render(){
 const term=$("search").value.trim().toLowerCase();
 const imgs=data.images.filter(i=>(!$("status").value||i.status===$("status").value)&&i.uses.some(u=>(!$("chapter").value||u.chapter===$("chapter").value)&&(!$("year").value||u.year===Number($("year").value)))&&(!term||JSON.stringify(i).toLowerCase().includes(term)));
 $("count").textContent="顯示 "+imgs.length+"／"+data.images.length+" 張圖片";$("grid").replaceChildren();
 for(const i of imgs){
 const card=add($("grid"),"article");const href="public"+i.src;const a=add(card,"a");a.href=href;a.target="_blank";a.rel="noopener";a.title="開啟原尺寸圖片";
 const im=add(a,"img");im.src=href;im.alt=i.uses[0].topic;im.loading="lazy";
 const b=add(card,"div",null,"body");add(b,"span",labels[i.status]||i.status,"badge "+(i.status==="difference-high"?"bad":i.status==="presentation-issue"?"warn":""));
 for(const u of i.uses){add(b,"h2",u.year+" 年"+(u.id.startsWith("cap-")?"會考":"基測")+" "+u.session+" 第 "+u.number+" 題");add(b,"div",u.topic);add(b,"code",u.id);}
 add(b,"p",i.note);const links=add(b,"div",null,"links");const full=add(links,"a","開啟圖片");full.href=href;full.target="_blank";full.rel="noopener";const folder=add(links,"a","所在資料夾");folder.href=href.slice(0,href.lastIndexOf("/"))+"/";folder.target="_blank";folder.rel="noopener";add(b,"div",href,"path");
 }
 if(!imgs.length)add($("grid"),"p","找不到符合條件的圖片。","empty");
}
for(const id of ["chapter","year","status","search"])$(id).addEventListener("input",render);
$("reset").onclick=()=>{for(const id of ["chapter","year","status","search"])$(id).value="";render()};render();
